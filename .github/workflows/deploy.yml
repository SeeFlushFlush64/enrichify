name: Build and Deploy to Azure Web App

on:
  push:
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0
          
      - name: Restore dependencies
        run: dotnet restore
        
      - name: Create appsettings.json
        run: |
          cat > ./Enrichify/appsettings.json << EOF
          {
            "Logging": {
              "LogLevel": {
                "Default": "Information",
                "Microsoft.AspNetCore": "Warning"
              }
            },
            "AllowedHosts": "*",
            "ConnectionStrings": {
              "DefaultConnection": "${{ secrets.CONNECTION_STRING_PRODUCTION }}"
            },
            "Hunter": {
              "ApiKey": "${{ secrets.HUNTER_API_KEY }}"
            }
          }
          EOF
        
      - name: Build
        run: dotnet build --configuration Release --no-restore
        
      - name: Publish
        run: dotnet publish ./Enrichify/Enrichify.csproj --configuration Release --output ./publish
      
      - name: Create deployment package
        run: |
          cd ./publish
          zip -r ../deploy.zip .
          cd ..
      
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_WEBAPP_NAME }} \
            --src-path ./deploy.zip \
            --type zip
      
      - name: Azure Logout
        run: az logout
        if: always()
