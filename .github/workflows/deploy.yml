name: Build project and deploy to SmarterASP.NET

on:
  push:
    branches: [ main ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0
          
      - name: Restore dependencies
        run: dotnet restore
        
      - name: Create appsettings.json
        run: |
          cat > ./Enrichify/appsettings.json << EOF
          {
            "Logging": {
              "LogLevel": {
                "Default": "Information",
                "Microsoft.AspNetCore": "Warning"
              }
            },
            "AllowedHosts": "*",
            "Hunter": {
              "ApiKey": "${{ secrets.HUNTER_API_KEY }}"
            }
          }
          EOF
        
      - name: Build
        run: dotnet build --configuration Release --no-restore
        
      - name: Publish
        run: dotnet publish ./Enrichify/Enrichify.csproj --configuration Release --output ./publish
      
      # Upload app_offline.htm first to stop the app
      - name: Upload app_offline.htm
        run: |
          echo "<h1>Updating site...</h1>" > app_offline.htm
          curl -T app_offline.htm ftp://win8155.site4now.net/enrichify/ --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}"
      
      # Wait a bit for IIS to release locks
      - name: Wait for app to stop
        run: sleep 10
        
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: win8155.site4now.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: /enrichify/
          exclude: |
            **/.git*
            **/.git*/**
      
      # Remove app_offline.htm to bring site back online
      - name: Remove app_offline.htm
        run: |
          curl -v ftp://win8155.site4now.net/enrichify/app_offline.htm --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -Q "DELE /enrichify/app_offline.htm"